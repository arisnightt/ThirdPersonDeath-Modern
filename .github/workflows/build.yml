name: Build & Release

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Required to create and upload to GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Needed for some version detection if you use git describe later

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write cache on main/master to save cache space on PRs
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Determine version
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Strip the leading "v" from the tag
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Using release version from tag: ${VERSION}"
          else
            # For branches / PRs use a dev identifier
            SHORT_SHA="${GITHUB_SHA::7}"
            VERSION="dev-${SHORT_SHA}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Using dev version: ${VERSION}"
          fi

      - name: Build with Gradle
        env:
          VERSION_OVERRIDE: ${{ steps.vars.outputs.version }}
        run: ./gradlew build --no-daemon

      - name: List built artifacts
        run: ls -la build/libs/

      - name: Upload build artifacts (for PRs and manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: thirdpersondeath-${{ steps.vars.outputs.version }}
          path: |
            build/libs/*.jar
          retention-days: 30
          if-no-files-found: error

      - name: Prepare nicely named release artifacts
        id: prepare
        if: steps.vars.outputs.is_release == 'true'
        run: |
          mkdir -p release-artifacts
          MC_VERSION=$(grep "^minecraft_version=" gradle.properties | cut -d= -f2 | tr -d ' \r')
          BASE="thirdpersondeath-${{ steps.vars.outputs.version }}"
          if [ -f "build/libs/${BASE}.jar" ]; then
            cp "build/libs/${BASE}.jar" "release-artifacts/${BASE}+mc${MC_VERSION}.jar"
          fi
          if [ -f "build/libs/${BASE}-sources.jar" ]; then
            cp "build/libs/${BASE}-sources.jar" "release-artifacts/${BASE}+mc${MC_VERSION}-sources.jar"
          fi
          echo "release_dir=release-artifacts" >> $GITHUB_OUTPUT
          ls -la release-artifacts/

      - name: Create / Update GitHub Release
        if: steps.vars.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Use the tag that triggered the workflow
          tag_name: ${{ github.ref_name }}
          name: Third Person Death ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # Attach the prepared artifacts (includes MC version in filename for clarity)
          files: |
            release-artifacts/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
